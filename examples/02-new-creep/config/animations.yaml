# The entity key is `creep_` + the creep's id. `image` is a path inside this mod's assets/ folder — put your
# art somewhere of your own (here `mods/example/`) so it can never collide with the game's or another mod's.
#
# This sheet is 8 columns x 4 rows of 32x32 cells; the clips below carve it into the four actions the game
# asks a creep for. Generated by tools/make_placeholder_sprites.py — bring your own art in a real mod.
entities:
  creep_blob:
    sheet: { image: "mods/example/blob.png", cellWidth: 32, cellHeight: 32 }
    clips:
      idle:   { from: 0,  to: 7,  fps: 6,  loop: true }
      walk:   { from: 8,  to: 15, fps: 10, loop: true }
      attack: { from: 16, to: 23, fps: 14, loop: false }
      dead:   { from: 24, to: 31, fps: 12, loop: false }
    actions: { IDLE: "idle", MOVE: "walk", WINDUP: "attack", ATTACK: "attack", DEAD: "dead" }
